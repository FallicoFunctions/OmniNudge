# Dependabot has two halves, and only one of them was configured.
#
# ALERTS are raised for every manifest GitHub can find, whether or not this file
# mentions it. UPDATES -- the pull requests that actually fix an alert -- are
# opened only for the ecosystems and directories listed here.
#
# This file listed three of the seven manifests in the repository, so the other
# four raised alerts that nothing could ever close. They arrived and stayed:
# 79 of the 89 open alerts came from directories with no update mechanism, and
# 54 of those were one package, Pillow, counted once per worker that pins it.
#
# Every manifest belongs here. A directory that is worth scanning is worth
# being able to fix.
#
# Each directory has two groups, because a group applies to version updates
# only unless it says otherwise. With one group, every security fix still
# arrived as a pull request of its own: eight of fifteen open pull requests
# were single-package security bumps that no group could collect.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ['*']
      github-actions-security:
        applies-to: security-updates
        patterns: ['*']

  - package-ecosystem: gomod
    directory: /backend
    schedule:
      interval: weekly
    groups:
      go-dependencies:
        patterns: ['*']
      go-security:
        applies-to: security-updates
        patterns: ['*']

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    # TypeScript 7 cannot install beside typescript-eslint 8, which accepts
    # TypeScript below 6.1. The weekly group carried the major bump anyway, so
    # npm refused the whole install and all 48 updates in it were blocked by
    # the one. Remove this once typescript-eslint supports TypeScript 7.
    ignore:
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
    groups:
      frontend-dependencies:
        patterns: ['*']
      frontend-security:
        applies-to: security-updates
        patterns: ['*']

  - package-ecosystem: npm
    directory: /omnirave-web
    schedule:
      interval: weekly
    groups:
      omnirave-web-dependencies:
        patterns: ['*']
      omnirave-web-security:
        applies-to: security-updates
        patterns: ['*']

  - package-ecosystem: npm
    directory: /omnirave-babylon
    schedule:
      interval: weekly
    groups:
      omnirave-babylon-dependencies:
        patterns: ['*']
      omnirave-babylon-security:
        applies-to: security-updates
        patterns: ['*']

  # The three workers pin the same imaging and model stack, so one CVE in
  # Pillow or transformers arrives three times. Grouped per worker, because a
  # worker is what gets rebuilt and redeployed as a unit.
  - package-ecosystem: pip
    directory: /infra/runpod/image-worker
    schedule:
      interval: weekly
    groups:
      image-worker-dependencies:
        patterns: ['*']
      image-worker-security:
        applies-to: security-updates
        patterns: ['*']

  - package-ecosystem: pip
    directory: /infra/runpod/video-worker
    schedule:
      interval: weekly
    groups:
      video-worker-dependencies:
        patterns: ['*']
      video-worker-security:
        applies-to: security-updates
        patterns: ['*']

  - package-ecosystem: pip
    directory: /infra/avatar-worker
    schedule:
      interval: weekly
    groups:
      avatar-worker-dependencies:
        patterns: ['*']
      avatar-worker-security:
        applies-to: security-updates
        patterns: ['*']
