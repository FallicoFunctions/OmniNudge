# Dependabot has two halves, and only one of them was configured.
#
# ALERTS are raised for every manifest GitHub can find, whether or not this file
# mentions it. UPDATES -- the pull requests that actually fix an alert -- are
# opened only for the ecosystems and directories listed here.
#
# This file listed three of the seven manifests in the repository, so the other
# four raised alerts that nothing could ever close. They arrived and stayed:
# 79 of the 89 open alerts came from directories with no update mechanism, and
# 54 of those were one package, Pillow, counted once per worker that pins it.
#
# Every manifest belongs here. A directory that is worth scanning is worth
# being able to fix.
#
# Each directory has three groups:
#
# - minor and patch updates, which rarely break and can merge every week;
# - major updates, one visible upgrade pull request per directory, which may
#   need a migration and must not hold back anything else;
# - security updates, because a group covers version updates only unless it
#   says otherwise, so every security fix used to open a pull request of its
#   own: eight of fifteen open pull requests were single-package bumps.
#
# One group for everything is what made the pile-up: the frontend group
# carried 19 major versions among 47 updates (ESLint 10, Vite 8, Vitest 5,
# Tailwind 4 and more), any one of them could fail the whole group, and none of
# the 47 could merge until all of them could.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    # Major action upgrades can change runner behavior and security semantics
    # (for example checkout's pull-request safety defaults). Keep them out of
    # the unattended queue; minor, patch, and security updates are validated and
    # merged by the repository policy workflow.
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    groups:
      github-actions:
        patterns: ['*']
        update-types: ['minor', 'patch']
      github-actions-security:
        applies-to: security-updates
        patterns: ['*']

  - package-ecosystem: gomod
    directory: /backend
    schedule:
      interval: daily
    groups:
      go-dependencies:
        patterns: ['*']
        update-types: ['minor', 'patch']
      go-majors:
        patterns: ['*']
        update-types: ['major']
      go-security:
        applies-to: security-updates
        patterns: ['*']

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: daily
    # TypeScript 7 cannot install beside typescript-eslint 8, which accepts
    # TypeScript below 6.1: npm refuses the install outright, so even the majors
    # group could never run with it inside. Remove this once typescript-eslint
    # supports TypeScript 7.
    ignore:
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      # The CSS directives, PostCSS plugin and style regression tests use v3.
      # A v4 upgrade needs a coordinated CSS migration, not a manifest bump.
      - dependency-name: tailwindcss
        update-types: ['version-update:semver-major']
    groups:
      frontend-dependencies:
        patterns: ['*']
        update-types: ['minor', 'patch']
      frontend-majors:
        patterns: ['*']
        update-types: ['major']
      frontend-security:
        applies-to: security-updates
        patterns: ['*']

  # /omnirave-web is deliberately not scanned. It is the retired react-three-fiber
  # runtime, replaced by /omnirave-babylon: nothing builds it, deploys it, or
  # serves it, and it is kept only as reference material. Scanning it produced
  # alerts nobody could act on, and the grouped bump in #86 raised react past the
  # @react-three/fiber peer ceiling, which left the lockfile unresolvable.

  - package-ecosystem: npm
    directory: /omnirave-babylon
    schedule:
      interval: daily
    groups:
      omnirave-babylon-dependencies:
        patterns: ['*']
        update-types: ['minor', 'patch']
      omnirave-babylon-majors:
        patterns: ['*']
        update-types: ['major']
      omnirave-babylon-security:
        applies-to: security-updates
        patterns: ['*']

  # The three workers pin the same imaging and model stack, so one CVE in
  # Pillow or transformers arrives three times. Grouped per worker, because a
  # worker is what gets rebuilt and redeployed as a unit.
  - package-ecosystem: pip
    directory: /infra/runpod/image-worker
    schedule:
      interval: daily
    # OpenCV 5 removes cv2.data.haarcascades, used for identity face crops.
    # Keep taking fixes on v4 until the detector has a replacement asset.
    ignore:
      - dependency-name: opencv-python-headless
        update-types: ['version-update:semver-major']
    groups:
      image-worker-dependencies:
        patterns: ['*']
        update-types: ['minor', 'patch']
      image-worker-majors:
        patterns: ['*']
        update-types: ['major']
      image-worker-security:
        applies-to: security-updates
        patterns: ['*']

  - package-ecosystem: pip
    directory: /infra/runpod/video-worker
    schedule:
      interval: daily
    groups:
      video-worker-dependencies:
        patterns: ['*']
        update-types: ['minor', 'patch']
      video-worker-majors:
        patterns: ['*']
        update-types: ['major']
      video-worker-security:
        applies-to: security-updates
        patterns: ['*']

  - package-ecosystem: pip
    directory: /infra/avatar-worker
    schedule:
      interval: daily
    # Match the Python 3.11 base image until that container is migrated.
    ignore:
      - dependency-name: numpy
        versions: ['>=2.5']
    groups:
      avatar-worker-dependencies:
        patterns: ['*']
        update-types: ['minor', 'patch']
      avatar-worker-majors:
        patterns: ['*']
        update-types: ['major']
      avatar-worker-security:
        applies-to: security-updates
        patterns: ['*']
