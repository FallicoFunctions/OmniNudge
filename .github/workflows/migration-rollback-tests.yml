name: Migration Rollback Tests

on:
  pull_request:
    branches: [main, master, develop]
    paths:
      - 'backend/internal/database/migrations/**'
      - 'backend/cmd/migrate/**'
      - 'scripts/test-migration-rollbacks.sh'
      - '.github/workflows/migration-rollback-tests.yml'
  push:
    branches: [main, master]
    paths:
      - 'backend/internal/database/migrations/**'
      - 'backend/cmd/migrate/**'
  workflow_dispatch: # Allow manual trigger

jobs:
  rollback-tests:
    name: Test Migration Rollbacks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: backend/go.sum

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Verify PostgreSQL connection
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -c "SELECT version();"

      - name: Run migration rollback tests
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: postgres
          DB_PASSWORD: postgres
        run: |
          chmod +x ./scripts/test-migration-rollbacks.sh
          ./scripts/test-migration-rollbacks.sh

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: migration-rollback-test-results
          path: |
            migration-rollback-*.log
          retention-days: 30
          if-no-files-found: ignore

  migration-safety-check:
    name: Migration Safety Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check for .down.sql files
        run: |
          echo "Checking that all .up.sql files have corresponding .down.sql files..."

          MISSING_DOWN_FILES=0

          for up_file in backend/internal/database/migrations/*.up.sql; do
            migration_name=$(basename "$up_file" .up.sql)
            down_file="backend/internal/database/migrations/${migration_name}.down.sql"

            if [ ! -f "$down_file" ]; then
              echo "❌ Missing rollback file: ${migration_name}.down.sql"
              MISSING_DOWN_FILES=$((MISSING_DOWN_FILES + 1))
            else
              echo "✓ Found rollback file: ${migration_name}.down.sql"
            fi
          done

          if [ $MISSING_DOWN_FILES -gt 0 ]; then
            echo ""
            echo "ERROR: $MISSING_DOWN_FILES migration(s) missing .down.sql files"
            exit 1
          else
            echo ""
            echo "✓ All migrations have rollback files"
          fi

      - name: Check for dangerous operations
        run: |
          echo "Scanning migrations for potentially dangerous operations..."

          DANGEROUS_PATTERNS=(
            "DROP TABLE(?! IF EXISTS)"
            "DROP COLUMN(?! IF EXISTS)"
            "ALTER TABLE.*DROP CONSTRAINT(?! IF EXISTS)"
            "TRUNCATE TABLE"
          )

          DANGEROUS_FOUND=0

          for pattern in "${DANGEROUS_PATTERNS[@]}"; do
            if grep -rP "$pattern" backend/internal/database/migrations/*.sql 2>/dev/null; then
              echo "⚠️  Found potentially dangerous operation: $pattern"
              DANGEROUS_FOUND=$((DANGEROUS_FOUND + 1))
            fi
          done

          if [ $DANGEROUS_FOUND -gt 0 ]; then
            echo ""
            echo "WARNING: Found $DANGEROUS_FOUND potentially dangerous operation(s)"
            echo "Consider using 'IF EXISTS' clauses to make operations idempotent"
            echo "This is a warning, not a failure - review manually"
          else
            echo ""
            echo "✓ No obviously dangerous operations found"
          fi

      - name: Check migration file naming
        run: |
          echo "Checking migration file naming conventions..."

          INVALID_NAMES=0

          for file in backend/internal/database/migrations/*.sql; do
            filename=$(basename "$file")

            # Check if filename matches pattern: NNN_description.up.sql or NNN_description.down.sql
            if ! echo "$filename" | grep -qE '^[0-9]{3,}_[a-z0-9_]+\.(up|down)\.sql$'; then
              echo "❌ Invalid filename format: $filename"
              echo "   Expected: NNN_description.up.sql or NNN_description.down.sql"
              INVALID_NAMES=$((INVALID_NAMES + 1))
            fi
          done

          if [ $INVALID_NAMES -gt 0 ]; then
            echo ""
            echo "ERROR: $INVALID_NAMES file(s) with invalid naming convention"
            exit 1
          else
            echo ""
            echo "✓ All migration files follow naming convention"
          fi

  notify-on-failure:
    name: Notify on Test Failure
    runs-on: ubuntu-latest
    needs: [rollback-tests, migration-safety-check]
    if: failure()

    steps:
      - name: Create failure summary
        run: |
          echo "## ⚠️ Migration Rollback Tests Failed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "One or more migration rollback tests failed." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Action Required:**" >> $GITHUB_STEP_SUMMARY
          echo "1. Review the test logs above" >> $GITHUB_STEP_SUMMARY
          echo "2. Fix the migration .down.sql file" >> $GITHUB_STEP_SUMMARY
          echo "3. Test locally: \`./scripts/test-migration-rollbacks.sh\`" >> $GITHUB_STEP_SUMMARY
          echo "4. Push the fix and re-run CI" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**See:** MIGRATION_ROLLBACK_RUNBOOK.md for guidance" >> $GITHUB_STEP_SUMMARY
