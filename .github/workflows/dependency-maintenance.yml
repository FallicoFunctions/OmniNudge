name: Dependency maintenance

on:
  schedule:
    - cron: '7 * * * *'
  workflow_run:
    workflows: ['CI', 'Security Scan']
    types: [completed]
  workflow_dispatch:
    inputs:
      verify_publication:
        description: 'Verify signed commits, App-created PRs and automatic merge with a whitespace-only lockfile change'
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: dependency-maintenance
  cancel-in-progress: false

jobs:
  repair:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AUDIT_REPAIR_VERIFY: ${{ github.event_name == 'workflow_dispatch' && inputs.verify_publication }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Use the validated lockfile writer
        run: npm install --global npm@11.12.1 --ignore-scripts --no-audit --no-fund
      - name: Prepare compatible lockfile repairs without running package scripts
        id: prepare
        run: node .github/scripts/npm-audit-repair.cjs prepare
      - name: Create a token only for repair PR creation
        if: steps.prepare.outputs.changed == 'true'
        id: pr-app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.DEPENDENCY_PR_APP_CLIENT_ID }}
          private-key: ${{ secrets.DEPENDENCY_PR_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-pull-requests: write
      - name: Submit signed repair through the configured PR App
        run: node .github/scripts/npm-audit-repair.cjs publish
        env:
          GH_TOKEN: ${{ github.token }}
          PR_CREATION_TOKEN: ${{ steps.pr-app.outputs.token }}
          DEPENDENCY_PR_APP_ACTUAL_SLUG: ${{ steps.pr-app.outputs.app-slug }}
          DEPENDENCY_PR_APP_SLUG: ${{ vars.DEPENDENCY_PR_APP_SLUG }}
