<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <style>
    body { margin: 0; }
    a { color: #7da8ff; text-decoration: none; }
    a:hover { color: #a8c6ff; }
    * { box-sizing: border-box; }
    input[type="range"] { accent-color: #5d8fff; }
  </style>
</helmet>
<div style="width: 1440px; height: 900px; display: flex; align-items: center; justify-content: center; background: radial-gradient(circle at 72% -10%, rgba(59,130,246,0.16), transparent 34rem), radial-gradient(circle at 22% 36%, rgba(96,165,250,0.07), transparent 28rem), #090a0f; font-family: Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif; color: #f7f7fb; overflow: hidden;">

  <div style="width: 1060px; height: 740px; display: flex; flex-direction: column; border-radius: 30px; border: 1px solid rgba(255,255,255,0.1); background: #0e1017; box-shadow: 0 32px 120px rgba(0,0,0,0.72); overflow: hidden;">

    <header style="display: flex; align-items: center; justify-content: space-between; gap: 20px; border-bottom: 1px solid rgba(255,255,255,0.1); padding: 22px 32px;">
      <p style="margin: 0; font-size: 11px; font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase; color: #7da8ff;">New independent character</p>
      <button type="button" aria-label="Close" style="display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; margin-right: -10px; border: none; border-radius: 999px; background: transparent; color: rgba(255,255,255,0.55); cursor: pointer;">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6L6 18M6 6l12 12"></path></svg>
      </button>
    </header>

    <div style="flex: 1; display: flex; min-height: 0;">

      <nav aria-label="Steps" style="width: 276px; flex-shrink: 0; border-right: 1px solid rgba(255,255,255,0.1); padding: 20px 16px; display: flex; flex-direction: column; gap: 2px; overflow-y: auto;">
        <sc-for list="{{ rail }}" as="entry" hint-placeholder-count="9">
          <button type="button" onClick="{{ entry.jump }}" aria-current="{{ entry.current }}" style="{{ entry.style }}">
            <span style="{{ entry.markStyle }}">
              <sc-if value="{{ entry.done }}" hint-placeholder-val="{{ true }}">
                <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6L9 17l-5-5"></path></svg>
              </sc-if>
              <sc-if value="{{ entry.showNumber }}" hint-placeholder-val="{{ true }}">{{ entry.number }}</sc-if>
            </span>
            <span style="{{ entry.labelStyle }}">{{ entry.label }}</span>
          </button>
        </sc-for>
      </nav>

      <div style="flex: 1; display: flex; flex-direction: column; min-width: 0;">

        <div style="flex: 1; overflow-y: auto; padding: 30px 34px; display: flex; flex-direction: column; gap: 24px;">

          <div style="display: flex; flex-direction: column; gap: 9px; max-width: 620px;">
            <h1 style="margin: 0; font-size: 30px; line-height: 1.16; font-weight: 600; letter-spacing: -0.02em; color: #ffffff; text-wrap: pretty;">{{ title }}</h1>
            <p style="margin: 0; font-size: 15px; line-height: 24px; color: rgba(255,255,255,0.55); text-wrap: pretty;">{{ sub }}</p>
          </div>

          <sc-if value="{{ showStyleCards }}" hint-placeholder-val="{{ true }}">
            <div style="display: flex; flex-direction: column; gap: 12px;">
              <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; max-width: 620px;">
                <sc-for list="{{ styleCards }}" as="card" hint-placeholder-count="2">
                  <button type="button" onClick="{{ card.pick }}" aria-pressed="{{ card.selected }}" style="{{ card.style }}">
                    <span style="{{ card.plateStyle }}">
                      <svg viewBox="0 0 64 64" width="76" height="76" aria-hidden="true">
                        <circle cx="32" cy="22" r="11" fill="{{ card.figureFill }}"></circle>
                        <path d="{{ card.figureBody }}" fill="{{ card.figureFill }}"></path>
                      </svg>
                    </span>
                    <span style="display: flex; flex-direction: column; gap: 4px; padding: 0 4px 2px 4px;">
                      <span style="font-size: 17px; font-weight: 600; color: #ffffff;">{{ card.label }}</span>
                      <span style="font-size: 13px; line-height: 19px; color: rgba(255,255,255,0.5);">{{ card.gloss }}</span>
                    </span>
                  </button>
                </sc-for>
              </div>
              <p style="margin: 0; font-size: 11px; color: rgba(255,255,255,0.3);">{{ sampleNote }}</p>
            </div>
          </sc-if>

          <sc-if value="{{ showGroups }}" hint-placeholder-val="{{ true }}">
            <div style="display: flex; flex-direction: column; gap: 24px;">
              <sc-for list="{{ groups }}" as="group" hint-placeholder-count="4">
                <div style="display: flex; flex-direction: column; gap: 11px;">
                  <div style="display: flex; align-items: baseline; justify-content: space-between; gap: 14px; max-width: 620px;">
                    <p style="margin: 0; font-size: 12px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: rgba(255,255,255,0.42);">{{ group.label }}</p>
                    <p style="margin: 0; font-size: 12px; font-weight: 600; color: {{ group.counterColour }}; font-variant-numeric: tabular-nums;">{{ group.counter }}</p>
                  </div>
                  <div style="display: grid; grid-template-columns: {{ group.columns }}; gap: 10px; max-width: 620px;">
                    <sc-for list="{{ group.options }}" as="option" hint-placeholder-count="6">
                      <button type="button" onClick="{{ option.pick }}" aria-pressed="{{ option.selected }}" style="{{ option.style }}">
                        <span style="font-size: 14px; font-weight: 500;">{{ option.label }}</span>
                        <span style="{{ option.glossStyle }}">{{ option.gloss }}</span>
                      </button>
                    </sc-for>
                  </div>
                </div>
              </sc-for>
            </div>
          </sc-if>

          <sc-if value="{{ showSlider }}" hint-placeholder-val="{{ true }}">
            <div style="display: flex; flex-direction: column; gap: 14px; max-width: 620px; border-radius: 18px; border: 1px solid rgba(255,255,255,0.1); background: rgba(255,255,255,0.035); padding: 20px 22px;">
              <div style="display: flex; align-items: baseline; justify-content: space-between;">
                <p style="margin: 0; font-size: 12px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: rgba(255,255,255,0.42);">Age</p>
                <p style="margin: 0; font-size: 32px; font-weight: 600; letter-spacing: -0.02em; color: #ffffff; font-variant-numeric: tabular-nums;">{{ ageLabel }}</p>
              </div>
              <input type="range" min="18" max="99" step="1" value="{{ age }}" onChange="{{ setAge }}" aria-label="Age" style="width: 100%; height: 24px;">
              <div style="display: flex; justify-content: space-between; font-size: 11px; color: rgba(255,255,255,0.35);">
                <span>18</span>
                <span>99</span>
              </div>
            </div>
          </sc-if>

          <sc-if value="{{ showName }}" hint-placeholder-val="{{ true }}">
            <div style="display: flex; flex-direction: column; gap: 8px; max-width: 440px;">
              <input type="text" value="{{ name }}" onChange="{{ setName }}" maxlength="40" placeholder="{{ namePlaceholder }}" aria-label="{{ namePlaceholder }}" style="width: 100%; height: 58px; border-radius: 14px; border: 1px solid rgba(255,255,255,0.1); background: rgba(255,255,255,0.035); padding: 0 18px; font-family: inherit; font-size: 19px; font-weight: 500; color: #ffffff; outline: none;">
              <p style="margin: 0; text-align: right; font-size: 11px; color: rgba(255,255,255,0.3); font-variant-numeric: tabular-nums;">{{ nameCount }}</p>
            </div>
          </sc-if>

          <sc-if value="{{ showReview }}" hint-placeholder-val="{{ true }}">
            <div style="display: flex; gap: 20px; align-items: flex-start;">
              <div style="width: 268px; flex-shrink: 0; display: flex; flex-direction: column; gap: 14px; border-radius: 22px; border: 1px solid rgba(93,143,255,0.7); background: rgba(49,92,168,0.14); box-shadow: 0 18px 70px rgba(49,92,168,0.16); padding: 20px;">
                <span style="display: flex; align-items: center; justify-content: center; width: 100%; height: 132px; border-radius: 16px; background: rgba(255,255,255,0.07);">
                  <svg viewBox="0 0 64 64" width="72" height="72" aria-hidden="true">
                    <circle cx="32" cy="22" r="11" fill="rgba(142,177,255,0.55)"></circle>
                    <path d="M11 60c0-11.5 9.4-18 21-18s21 6.5 21 18z" fill="rgba(142,177,255,0.55)"></path>
                  </svg>
                </span>
                <span style="display: flex; flex-direction: column; gap: 6px;">
                  <span style="font-size: 21px; font-weight: 600; color: #ffffff;">{{ reviewName }}</span>
                  <span style="font-size: 13px; line-height: 19px; color: rgba(255,255,255,0.55);">{{ reviewLine }}</span>
                </span>
              </div>
              <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 14px;">
                <div style="display: flex; flex-direction: column; border-radius: 18px; border: 1px solid rgba(255,255,255,0.1); background: rgba(255,255,255,0.035); overflow: hidden;">
                  <sc-for list="{{ reviewRows }}" as="row" hint-placeholder-count="6">
                    <div style="{{ row.style }}">
                      <span style="font-size: 13px; color: rgba(255,255,255,0.45);">{{ row.label }}</span>
                      <span style="font-size: 13px; font-weight: 500; color: rgba(255,255,255,0.9); text-align: right;">{{ row.value }}</span>
                    </div>
                  </sc-for>
                </div>
                <p style="margin: 0; font-size: 12px; line-height: 19px; color: rgba(255,255,255,0.42);">{{ deletionNote }}</p>
              </div>
            </div>
          </sc-if>

        </div>

        <footer style="display: flex; align-items: center; justify-content: space-between; gap: 16px; border-top: 1px solid rgba(255,255,255,0.1); padding: 18px 34px;">
          <p style="{{ hintStyle }}">{{ hint }}</p>
          <div style="display: flex; align-items: center; gap: 10px; margin-left: auto;">
            <button type="button" onClick="{{ back }}" style="{{ backStyle }}">Back</button>
            <button type="button" onClick="{{ next }}" disabled="{{ nextDisabled }}" style="{{ nextStyle }}">{{ nextLabel }}</button>
          </div>
        </footer>

      </div>
    </div>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"start":{"editor":"int","default":1,"min":1,"max":9,"section":"Flow"},"gender":{"editor":"enum","options":["","woman","man"],"default":"","section":"Flow"},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = {
      step: props.start || 1,
      style: '', gender: props.gender || '', age: 27,
      ethnicity: '', hair: '', hairColour: '', eyes: '', build: '',
      temperaments: [], interests: [], feeling: '', name: ''
    };
  }

  componentDidUpdate(prev) {
    if (prev.start !== this.props.start) this.setState({ step: this.props.start || 1 });
    if (prev.gender !== this.props.gender) this.setState({ gender: this.props.gender || '' });
  }

  optionStyle(selected, gloss) {
    const border = selected ? '1px solid #5d8fff' : '1px solid rgba(255,255,255,0.1)';
    const background = selected ? 'rgba(49,92,168,0.15)' : 'rgba(255,255,255,0.035)';
    const colour = selected ? '#ffffff' : 'rgba(255,255,255,0.75)';
    return 'display: flex; flex-direction: column; gap: 3px; align-items: flex-start; justify-content: center; min-height: ' +
      (gloss ? '58px' : '46px') + '; padding: ' + (gloss ? '11px 14px' : '10px 14px') +
      '; border-radius: 12px; border: ' + border + '; background: ' + background + '; color: ' + colour +
      '; font-family: inherit; text-align: left; cursor: pointer; transition: border-color .15s ease, background .15s ease;';
  }

  glossStyle(gloss) {
    if (!gloss) return 'display: none;';
    return 'font-size: 11px; line-height: 15px; color: rgba(255,255,255,0.45);';
  }

  chips(list, chosen, onPick) {
    return list.map((entry) => {
      const selected = chosen === entry[0] || (Array.isArray(chosen) && chosen.indexOf(entry[0]) !== -1);
      return {
        key: entry[0], label: entry[1], gloss: entry[2] || '', selected: selected,
        style: this.optionStyle(selected, entry[2]), glossStyle: this.glossStyle(entry[2]),
        pick: () => onPick(entry[0])
      };
    });
  }

  one(field) { return (key) => this.setState({ [field]: key }); }

  many(field, limit) {
    return (key) => {
      const current = this.state[field];
      if (current.indexOf(key) !== -1) {
        this.setState({ [field]: current.filter((entry) => entry !== key) });
      } else if (current.length < limit) {
        this.setState({ [field]: current.concat([key]) });
      }
    };
  }

  pronouns() {
    const gender = this.state.gender;
    if (gender === 'man') return { subj: 'he', Subj: 'He', obj: 'him', poss: 'his', Poss: 'His', is: 'is', s: 's', noun: 'man' };
    if (gender === 'woman') return { subj: 'she', Subj: 'She', obj: 'her', poss: 'her', Poss: 'Her', is: 'is', s: 's', noun: 'woman' };
    return { subj: 'they', Subj: 'They', obj: 'them', poss: 'their', Poss: 'Their', is: 'are', s: '', noun: 'character' };
  }

  screen() {
    const p = this.pronouns();
    switch (this.state.step) {
      case 1: return { title: 'Who are we making', sub: 'The basics first, because everything after this follows from them. Nobody under 18 is made here.' };
      case 2: return { title: 'Pick a look', sub: 'This is the world ' + p.subj + ' ' + p.is + ' drawn in. It does not change who ' + p.subj + ' ' + p.is + '.' };
      case 3: return { title: p.Poss + ' face', sub: 'Recorded now, drawn later. Skip anything you have no view on.' };
      case 4: return { title: p.Poss + ' build', sub: 'One more detail for the likeness, then we are done with how ' + p.subj + ' look' + p.s + '.' };
      case 5: return { title: p.Subj + ' will not stay this way', sub: 'Pick three. This is where ' + p.subj + ' start' + p.s + ', and what happens between you moves ' + p.obj + ' off it.' };
      case 6: return { title: 'What ' + p.subj + ' ' + p.is + ' into', sub: 'Up to three. These come up on ' + p.poss + ' own, and ' + p.subj + ' can pick up new ones later.' };
      case 7: return { title: 'Where you two are starting from', sub: 'How ' + p.subj + ' ' + p.is + ' with you on the day you meet. Anyone else starts from nothing.' };
      case 8: return { title: 'What is ' + p.poss + ' name', sub: p.Subj + ' answer' + p.s + ' to this. You can call ' + p.obj + ' something else later; ' + p.subj + ' may not take to it.' };
      default: return { title: 'Meet ' + p.obj, sub: 'This is who you made. ' + p.Subj + ' take' + p.s + ' it from here.' };
    }
  }

  ready() {
    const s = this.state;
    if (s.step === 1) return !!s.gender;
    if (s.step === 2) return !!s.style;
    if (s.step === 5) return s.temperaments.length === 3;
    if (s.step === 7) return !!s.feeling;
    if (s.step === 8) return s.name.trim().length > 0;
    return true;
  }

  hint() {
    const s = this.state;
    if (s.step === 3 || s.step === 4 || s.step === 6) return 'You can skip this.';
    if (s.step === 5 && s.temperaments.length !== 3) return 'Choose three to carry on.';
    return '';
  }

  renderVals() {
    const s = this.state;
    const screen = this.screen();
    const ready = this.ready();

    const p = this.pronouns();
    const stepNames = ['The basics', 'Look', p.Poss + ' face', p.Poss + ' build', 'Where ' + p.subj + ' start' + p.s, 'Interests', 'With you', 'Name', 'Meet ' + p.obj];
    const rail = stepNames.map((label, index) => {
      const number = index + 1;
      const done = number < s.step;
      const current = number === s.step;
      const reachable = number <= s.step;
      const markBase = 'display: flex; align-items: center; justify-content: center; width: 24px; height: 24px; flex-shrink: 0; border-radius: 999px; font-size: 11px; font-weight: 700; font-variant-numeric: tabular-nums; ';
      return {
        label: label, number: String(number), done: done, showNumber: !done, current: current ? 'step' : undefined,
        style: 'display: flex; align-items: center; gap: 11px; width: 100%; min-height: 44px; padding: 8px 12px; border: none; border-radius: 12px; font-family: inherit; text-align: left; background: ' +
          (current ? 'rgba(49,92,168,0.15)' : 'transparent') + '; cursor: ' + (reachable ? 'pointer' : 'default') + '; transition: background .15s ease;',
        markStyle: markBase + (done ? 'background: rgba(93,143,255,0.2); color: #7da8ff;' : current ? 'background: #426fc4; color: #ffffff;' : 'background: rgba(255,255,255,0.06); color: rgba(255,255,255,0.35);'),
        labelStyle: 'font-size: 13.5px; font-weight: ' + (current ? '600' : '500') + '; color: ' +
          (current ? '#ffffff' : done ? 'rgba(255,255,255,0.62)' : 'rgba(255,255,255,0.32)') + ';',
        jump: () => { if (number <= this.state.step) this.setState({ step: number }); }
      };
    });

    const groups = [];
    if (s.step === 1) {
      groups.push({ label: 'Woman or man', counter: '', counterColour: 'rgba(255,255,255,0.4)', columns: 'repeat(2, minmax(0, 1fr))',
        options: this.chips([['woman', 'A woman', ''], ['man', 'A man', '']], s.gender, this.one('gender')) });
    }
    if (s.step === 3) {
      groups.push({ label: 'Ethnicity', counter: '', counterColour: 'rgba(255,255,255,0.4)', columns: 'repeat(3, minmax(0, 1fr))',
        options: this.chips([['caucasian', 'Caucasian', ''], ['asian', 'Asian', ''], ['black', 'Black', ''], ['latina', 'Latina', ''], ['arab', 'Arab', ''], ['mixed', 'Mixed', '']], s.ethnicity, this.one('ethnicity')) });
      groups.push({ label: 'Hair', counter: '', counterColour: 'rgba(255,255,255,0.4)', columns: 'repeat(3, minmax(0, 1fr))',
        options: this.chips([['straight', 'Straight', ''], ['bangs', 'Bangs', ''], ['curly', 'Curly', ''], ['bun', 'Bun', ''], ['short', 'Short', ''], ['ponytail', 'Ponytail', '']], s.hair, this.one('hair')) });
      groups.push({ label: 'Hair colour', counter: '', counterColour: 'rgba(255,255,255,0.4)', columns: 'repeat(5, minmax(0, 1fr))',
        options: this.chips([['brunette', 'Brunette', ''], ['blonde', 'Blonde', ''], ['black', 'Black', ''], ['red', 'Red', ''], ['dyed', 'Dyed', '']], s.hairColour, this.one('hairColour')) });
      groups.push({ label: 'Eyes', counter: '', counterColour: 'rgba(255,255,255,0.4)', columns: 'repeat(5, minmax(0, 1fr))',
        options: this.chips([['brown', 'Brown', ''], ['blue', 'Blue', ''], ['green', 'Green', ''], ['grey', 'Grey', ''], ['hazel', 'Hazel', '']], s.eyes, this.one('eyes')) });
    }
    if (s.step === 4) {
      groups.push({ label: 'Build', counter: '', counterColour: 'rgba(255,255,255,0.4)', columns: 'repeat(5, minmax(0, 1fr))',
        options: this.chips([['slim', 'Slim', ''], ['athletic', 'Athletic', ''], ['average', 'Average', ''], ['curvy', 'Curvy', ''], ['heavy', 'Heavy', '']], s.build, this.one('build')) });
    }
    if (s.step === 5) {
      groups.push({ label: 'Where ' + p.subj + ' start' + p.s, counter: s.temperaments.length + ' of 3', counterColour: s.temperaments.length === 3 ? '#7da8ff' : 'rgba(255,255,255,0.4)', columns: 'repeat(2, minmax(0, 1fr))',
        options: this.chips([
          ['warm', 'Warm', 'Open with people'],
          ['guarded', 'Guarded', 'Slow to let you in'],
          ['blunt', 'Blunt', 'Says the hard thing'],
          ['playful', 'Playful', 'Teases before anything else'],
          ['dry', 'Dry', 'Understated, deadpan'],
          ['earnest', 'Earnest', 'Means what ' + p.subj + ' say' + p.s],
          ['restless', 'Restless', 'Never settles for long'],
          ['steady', 'Steady', 'Hard to knock off course'],
          ['sharp', 'Sharp', 'Quick, notices everything'],
          ['quiet', 'Quiet', 'Speaks when it matters']
        ], s.temperaments, this.many('temperaments', 3)) });
    }
    if (s.step === 6) {
      groups.push({ label: p.Poss + ' own interests', counter: s.interests.length + ' of 3', counterColour: s.interests.length === 3 ? '#7da8ff' : 'rgba(255,255,255,0.4)', columns: 'repeat(3, minmax(0, 1fr))',
        options: this.chips([
          ['games', 'Games', ''], ['music', 'Music', ''], ['film', 'Films and shows', ''],
          ['reading', 'Reading', ''], ['making_things', 'Drawing and making things', ''],
          ['fitness', 'Being physical', ''], ['cooking', 'Cooking', ''],
          ['going_out', 'Going out', ''], ['staying_in', 'Staying in', '']
        ], s.interests, this.many('interests', 3)) });
    }
    if (s.step === 7) {
      groups.push({ label: 'How ' + p.subj + ' ' + p.is + ' with you', counter: '', counterColour: 'rgba(255,255,255,0.4)', columns: 'repeat(2, minmax(0, 1fr))',
        options: this.chips([
          ['indifferent', 'Indifferent', 'You are a stranger'],
          ['curious', 'Curious', 'Interested, nothing more'],
          ['fond', 'Fond', 'Glad you are here'],
          ['close', 'Close', 'Trusts you already'],
          ['devoted', 'Devoted', 'You matter most'],
          ['besotted', 'Besotted', 'Head over heels']
        ], s.feeling, this.one('feeling')) });
    }

    const styleCardStyle = (selected) => 'display: flex; flex-direction: column; gap: 14px; padding: 14px; border-radius: 24px; border: ' +
      (selected ? '1px solid #5d8fff' : '1px solid rgba(255,255,255,0.1)') + '; background: ' +
      (selected ? 'rgba(49,92,168,0.15)' : 'rgba(255,255,255,0.035)') +
      '; cursor: pointer; font-family: inherit; text-align: left; transition: border-color .15s ease, background .15s ease;';
    const plate = (tint) => 'display: flex; align-items: center; justify-content: center; height: 186px; border-radius: 16px; background: ' + tint + ';';
    const figureBody = s.gender === 'man'
      ? 'M8 60c0-12.5 10.5-19 24-19s24 6.5 24 19z'
      : 'M12 60c0-11 9-18 20-18s20 7 20 18z';
    const styleCards = [
      { key: 'realistic', label: 'Realistic', gloss: 'Photographic, closer to a person you could meet.',
        selected: s.style === 'realistic', style: styleCardStyle(s.style === 'realistic'),
        plateStyle: plate('linear-gradient(160deg, rgba(255,255,255,0.07), rgba(255,255,255,0.02))'), figureFill: 'rgba(255,255,255,0.28)', figureBody: figureBody,
        pick: () => this.setState({ style: 'realistic' }) },
      { key: 'anime', label: 'Anime', gloss: 'Drawn, stylised, brighter than life.',
        selected: s.style === 'anime', style: styleCardStyle(s.style === 'anime'),
        plateStyle: plate('linear-gradient(160deg, rgba(96,165,250,0.16), rgba(59,130,246,0.05))'), figureFill: 'rgba(142,177,255,0.5)', figureBody: figureBody,
        pick: () => this.setState({ style: 'anime' }) }
    ];

    const readable = (value, fallback) => value ? value.charAt(0).toUpperCase() + value.slice(1) : fallback;
    const rowStyle = (last) => 'display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 13px 16px;' +
      (last ? '' : ' border-bottom: 1px solid rgba(255,255,255,0.07);');
    const lookParts = [readable(s.style, ''), readable(s.gender, ''), String(s.age)].filter(Boolean);
    const reviewRows = [
      { label: 'Look', value: lookParts.join(' · ') || 'Not chosen', style: rowStyle(false) },
      { label: 'Face', value: [readable(s.ethnicity, ''), readable(s.hair, ''), readable(s.hairColour, ''), readable(s.eyes, '')].filter(Boolean).join(' · ') || 'Left open', style: rowStyle(false) },
      { label: 'Build', value: readable(s.build, 'Left open'), style: rowStyle(false) },
      { label: p.Subj + ' start' + p.s, value: s.temperaments.length ? s.temperaments.map((k) => readable(k, '')).join(', ') : 'Not chosen', style: rowStyle(false) },
      { label: p.Subj + ' ' + p.is + ' into', value: s.interests.length ? s.interests.map((k) => readable(k.replace('_', ' '), '')).join(', ') : 'Nothing yet', style: rowStyle(false) },
      { label: 'With you', value: readable(s.feeling, 'Not chosen'), style: rowStyle(true) }
    ];

    const nextLabel = s.step === 9 ? 'Start talking to ' + p.obj : (s.step === 8 ? 'Make ' + p.obj : 'Continue');
    const nextStyle = 'min-width: 168px; height: 46px; padding: 0 26px; border: none; border-radius: 999px; font-family: inherit; font-size: 14.5px; font-weight: 600; transition: background .15s ease; ' +
      (ready ? 'background: #426fc4; color: #ffffff; cursor: pointer;' : 'background: rgba(255,255,255,0.06); color: rgba(255,255,255,0.3); cursor: not-allowed;');
    const hint = this.hint();

    return {
      rail: rail,
      title: screen.title,
      sub: screen.sub,
      showStyleCards: s.step === 2,
      showGroups: groups.length > 0,
      showSlider: s.step === 1,
      showName: s.step === 8,
      showReview: s.step === 9,
      styleCards: styleCards,
      groups: groups,
      age: s.age,
      ageLabel: String(s.age),
      setAge: (event) => this.setState({ age: Number(event.target.value) }),
      name: s.name,
      nameCount: s.name.length + ' / 40',
      setName: (event) => this.setState({ name: event.target.value.slice(0, 40) }),
      namePlaceholder: p.Poss + ' name',
      deletionNote: 'You can keep one independent character. Making another means deleting ' + p.obj +
        ', and everything ' + p.subj + ' remember' + p.s + ' goes with ' + p.obj + '.',
      reviewName: s.name.trim() || 'Unnamed',
      reviewLine: 'Independent. ' + p.Subj + ' answer' + p.s + ' when ' + p.subj + ' answer' + p.s + ', and ' + p.subj + ' ' + p.is + ' not obliged to agree with you.',
      sampleNote: '[SAMPLE ART PLACEHOLDER — the real cards show a generated ' + p.noun + ' in each style]',
      reviewRows: reviewRows,
      hint: hint,
      hintStyle: hint ? 'margin: 0; font-size: 12.5px; color: rgba(255,255,255,0.35);' : 'display: none;',
      nextLabel: nextLabel,
      nextStyle: nextStyle,
      nextDisabled: !ready,
      backStyle: 'height: 46px; padding: 0 20px; border: none; border-radius: 999px; background: transparent; font-family: inherit; font-size: 14.5px; font-weight: 600; color: rgba(255,255,255,0.6); cursor: pointer;' + (s.step === 1 ? ' visibility: hidden;' : ''),
      next: () => { if (this.ready() && s.step < 9) this.setState({ step: s.step + 1 }); },
      back: () => { if (s.step > 1) this.setState({ step: s.step - 1 }); }
    };
  }
}
</script>
</body>
</html>
