# OmniNudge — local development stack
#
# Usage:
#   docker compose up -d            # start everything
#   docker compose up -d backend    # start only backend + its deps
#   docker compose logs -f backend  # tail logs
#   docker compose down -v          # stop and remove volumes
#
# The backend and worker are built from source on first run.
# Pass VITE_* build args to the frontend service to customise API URLs.

name: omninudge

volumes:
  postgres-data:
  redis-data:
  uploads:

networks:
  app:
    driver: bridge

services:

  # ─── Infrastructure ──────────────────────────────────────────────────────────

  postgres:
    image: postgres:15-alpine
    container_name: omninudge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: omninudge
      POSTGRES_PASSWORD: omninudge
      POSTGRES_DB: omninudge_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - app
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omninudge -d omninudge_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: omninudge-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - app
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ─── Migrations (runs once, then exits) ──────────────────────────────────────

  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: omninudge-migrate
    entrypoint: ["/migrate"]
    command: ["up"]
    environment:
      DATABASE_URL: postgres://omninudge:omninudge@postgres:5432/omninudge_dev?sslmode=disable
    networks:
      - app
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # ─── Backend API server ───────────────────────────────────────────────────────

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: omninudge-backend
    restart: unless-stopped
    environment:
      APP_ENV: development
      SERVER_PORT: "8080"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: omninudge
      DB_PASSWORD: omninudge
      DB_NAME: omninudge_dev
      DB_SSLMODE: disable
      DB_AUTO_MIGRATE: "false"        # migrate service runs migrations
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ""
      JWT_SECRET: dev-jwt-secret-change-in-production
      FRONTEND_URL: http://localhost:5176
      METRICS_TOKEN: ""               # open in dev
      ASYNQMON_TOKEN: ""              # open in dev
    ports:
      - "8080:8080"
    volumes:
      - uploads:/uploads
    networks:
      - app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health/liveness || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ─── Background job worker ────────────────────────────────────────────────────

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: omninudge-worker
    entrypoint: ["/worker"]
    restart: unless-stopped
    environment:
      APP_ENV: development
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: omninudge
      DB_PASSWORD: omninudge
      DB_NAME: omninudge_dev
      DB_SSLMODE: disable
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ""
      WORKER_CONCURRENCY: "5"
      VIRUS_SCAN_ENABLED: "false"     # enable when ClamAV is available
    networks:
      - app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ─── Frontend ─────────────────────────────────────────────────────────────────

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:8080/api/v1
        VITE_WS_URL: ws://localhost:8080/ws
    container_name: omninudge-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    networks:
      - app
    depends_on:
      backend:
        condition: service_healthy
