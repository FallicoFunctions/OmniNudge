<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OmniRave · Complete characters</title>
<style>*{box-sizing:border-box}body{margin:0;background:#171a22;color:#f0f1f5;font:15px/1.5 system-ui}main{max-width:1500px;margin:auto;padding:20px}h1{font-size:25px;margin:0}p{color:#bbc1cf;margin:5px 0 16px}.controls{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin:12px 0}button,select,a{font:inherit;color:inherit;background:#303647;border:1px solid #5b647c;padding:7px 12px;border-radius:6px;text-decoration:none}button[aria-pressed=true]{background:#dfbe86;color:#211d18}.stage{display:grid;grid-template-columns:1fr 1.4fr;gap:16px}figure{margin:0;min-width:0}img,canvas{height:70vh;min-height:460px;width:100%;object-fit:contain;background:#22252d;border-radius:8px;display:block}canvas{touch-action:none;outline:0}figcaption,#status{color:#bfc6d5;font-size:13px;margin-top:8px}input{vertical-align:middle}#image-output{margin-top:24px}#image-output[hidden]{display:none}#image-preview{width:auto;max-width:100%;height:auto;min-height:0;margin-top:12px}button:disabled{opacity:.55;cursor:wait}#wardrobe fieldset{display:flex;gap:16px;align-items:center;flex-wrap:wrap;border:1px solid #5b647c;border-radius:6px}#wardrobe label{display:flex;gap:6px;align-items:center}@media(max-width:760px){.stage{grid-template-columns:1fr}img{height:40vh;min-height:250px}canvas{height:60vh;min-height:350px}}</style></head>
<body><main><h1>Complete characters</h1><p>Original artwork beside the fitted, animated model. Drag to orbit and scroll to zoom.</p><div class="controls"><label>Character <select id="character"><option value="male">Luxury · Male</option><option value="female">PLURR · Female</option></select></label><button data-view="front">Front</button><button data-view="three-quarter">Three-quarter</button><button data-view="side">Side</button><button data-view="back">Back</button><button data-view="face">Face</button><button data-view="hair">Hair</button><button data-view="hands">Hands</button><button data-view="feet">Footwear</button><button id="export-image" disabled>High-resolution image</button><a href="/crowd-review.html">Crowd review</a><a href="/fireworks-review.html">Fireworks review</a><a id="venue" href="/?avatarComplete=male">Open in venue</a></div><div class="controls" aria-label="Expression controls"><label>Expression <select id="expression"><option value="neutral">Neutral</option><option value="smile">Soft smile</option><option value="curious">Curious</option></select></label><label>Strength <input id="expression-strength" type="range" min="0" max="100" value="100"></label><label>Eyes <select id="blink"><option value="auto">Natural blinking</option><option value="open">Open</option><option value="closed">Closed</option><option value="left">Left wink</option><option value="right">Right wink</option></select></label><label><input id="hair-motion" type="checkbox" checked> Hair motion</label></div><div class="stage"><figure><img id="reference" alt="Original character artwork"><figcaption>Original artwork</figcaption></figure><figure><canvas id="canvas" aria-label="Animated complete character"></canvas><figcaption>Complete outfit · Babylon.js</figcaption></figure></div><div class="controls"><button data-motion="idle" aria-pressed="true">Idle</button><button data-motion="walk">Walk</button><button data-motion="run">Run</button><label><input id="crouch" type="checkbox"> Crouch</label><button id="pause" aria-pressed="false">Pause</button><label>Outfit <select id="outfit"><option value="complete">Complete</option><option value="no-jacket">Jacket off</option><option value="body">Body and face</option><option value="custom" disabled>Custom parts</option></select></label><label>Frame <input id="frame" type="range" min="0" max="90" value="0"></label></div><div id="wardrobe"></div><div id="status" role="status">Loading character…</div><section id="image-output" hidden aria-label="High-resolution preview"><a id="image-download" download>Download PNG · 1536 × 2048</a><p>Full-resolution render of this view. Download and open at actual size to inspect fine detail.</p><img id="image-preview" alt="High-resolution character render"></section></main><script type="module" src="/src/review/complete.ts"></script></body></html>
